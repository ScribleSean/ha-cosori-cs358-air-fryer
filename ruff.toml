target-version = "py314"
line-length = 110

[lint]
exclude = ["custom_components/cosori_fryer/_vendor/**"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "SLF"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S324", "SLF001"]

# Preserve the upstream source apart from deterministic import rewriting.
[format]
exclude = ["custom_components/cosori_fryer/_vendor/**"]
