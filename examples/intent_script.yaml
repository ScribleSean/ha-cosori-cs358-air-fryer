# Spoken replies for the sentences in custom_sentences/en/air_fryer.yaml
intent_script:
  FryerPreheat:
    action:
      - action: script.preheat_air_fryer
        data:
          temp: "{{ temp }}"
          minutes: "{{ minutes }}"
    speech:
      text: "Preheating the air fryer to {{ temp }} degrees, with {{ minutes }} minutes queued."
  FryerStart:
    action:
      - action: script.start_air_fryer
    speech:
      text: "Starting the air fryer."
  FryerStop:
    action:
      - action: script.stop_air_fryer
    speech:
      text: "Stopping the air fryer."
  FryerTimeLeft:
    speech:
      text: >-
        {% set left = states('sensor.air_fryer_time_remaining') | float(0) %}
        {% if left > 0 %}About {{ left | round(0, 'ceil') | int }} minutes left on the air fryer.
        {% else %}Nothing is running on the air fryer.{% endif %}
  FryerStatus:
    speech:
      text: >-
        {% set state = states('sensor.air_fryer_status') %}
        {% set left = states('sensor.air_fryer_time_remaining') | float(0) | round(0, 'ceil') | int %}
        The air fryer is {{ state_translated('sensor.air_fryer_status') | lower }}{% if left > 0 %}, with {{ left }} minutes left{% endif %}.
