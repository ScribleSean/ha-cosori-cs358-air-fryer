# Spoken replies for the sentences in custom_sentences_en_air_fryer.yaml. Add to configuration.yaml.
intent_script:
  FryerPreheat:
    action:
      - action: cosori_fryer.start_cooking
        data:
          temperature: "{{ temperature }}"
          cooking_time: "{{ cooking_time }}"
          preheat: true
    speech:
      text: "Preheating to {{ temperature }} degrees Fahrenheit for a {{ cooking_time }} minute cook."
  FryerStart:
    action:
      - action: button.press
        target:
          entity_id: button.air_fryer_start
    speech:
      text: "Starting the air fryer."
  FryerStop:
    action:
      - action: button.press
        target:
          entity_id: button.air_fryer_stop
    speech:
      text: "Stopping the air fryer."
  FryerTimeLeft:
    speech:
      text: >-
        {% set left = states('sensor.air_fryer_remaining_time') | int(0) %}
        {% set status = state_translated('sensor.air_fryer_cooking_status') | lower %}
        {% if left > 0 %}{{ left }} minutes left, {{ status }}.{% else %}The air fryer is {{ status }}.{% endif %}
