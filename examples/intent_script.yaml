# Spoken replies for the sentences in custom_sentences_en_air_fryer.yaml. Add to configuration.yaml.
intent_script:
  FryerPreheat:
    action:
      - action: cosori_fryer.preheat
        data:
          temperature: "{{ temperature }}"
    speech:
      text: "Preheating the air fryer to {{ temperature }} degrees."
  FryerAirFry:
    action:
      - action: cosori_fryer.air_fry
        data:
          temperature: "{{ temperature }}"
          minutes: "{{ minutes }}"
    speech:
      text: "Air frying at {{ temperature }} degrees for {{ minutes }} minutes."
  FryerStop:
    action:
      - action: cosori_fryer.stop
    speech:
      text: "Stopping the air fryer."
  FryerTimeLeft:
    speech:
      text: >-
        {% set left = states('sensor.air_fryer_time_remaining') | int(0) %}
        {% if left > 0 %}About {{ left }} minutes left, {{ state_translated('sensor.air_fryer_cooking_status') | lower }}.
        {% else %}The air fryer is {{ state_translated('sensor.air_fryer_cooking_status') | lower }}.{% endif %}
