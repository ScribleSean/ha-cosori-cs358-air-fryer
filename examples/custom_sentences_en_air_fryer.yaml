# Copy to custom_sentences/en/air_fryer.yaml
language: "en"
intents:
  FryerPreheat:
    data:
      - sentences:
          - "preheat [the] air fryer [to] {temperature} [degrees] for {cooking_time} minute[s]"
  FryerStart:
    data:
      - sentences:
          - "start [the] air fryer"
  FryerStop:
    data:
      - sentences:
          - "(stop|cancel) [the] air fryer"
  FryerTimeLeft:
    data:
      - sentences:
          - "how (long|much time) is left on [the] air fryer"
lists:
  temperature:
    range:
      from: 170
      to: 400
      step: 10
  cooking_time:
    range:
      from: 1
      to: 60
