# Copy to custom_sentences/en/air_fryer.yaml
language: "en"
intents:
  FryerPreheat:
    data:
      - sentences:
          - "preheat [the] air fryer [to] {temperature} [degrees]"
  FryerAirFry:
    data:
      - sentences:
          - "air fry [for] {minutes} minute[s] at {temperature} [degrees]"
          - "air fry at {temperature} [degrees] for {minutes} minute[s]"
  FryerStop:
    data:
      - sentences:
          - "(stop|cancel) [the] air fryer"
  FryerTimeLeft:
    data:
      - sentences:
          - "how (long|much time) is left on [the] air fryer"
lists:
  temperature:
    range:
      from: 170
      to: 400
      step: 10
  minutes:
    range:
      from: 1
      to: 60
