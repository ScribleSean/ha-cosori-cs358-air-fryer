# Friendly-named scripts for Assist and voice shortcuts. Add to scripts.yaml.
preheat_air_fryer:
  alias: Preheat air fryer
  description: Preheat the air fryer; press Start when it's done.
  icon: mdi:fire
  mode: single
  fields:
    temperature:
      name: Temperature
      required: true
      selector:
        number: {min: 170, max: 400, step: 10, unit_of_measurement: "°F"}
    cooking_time:
      name: Cooking time
      required: true
      selector:
        number: {min: 1, max: 60, unit_of_measurement: min}
  sequence:
    - action: cosori_fryer.start_cooking
      data:
        temperature: "{{ temperature }}"
        cooking_time: "{{ cooking_time }}"
        preheat: true

start_air_fryer:
  alias: Start air fryer
  description: Press Start, as on the fryer.
  icon: mdi:play
  mode: single
  sequence:
    - action: button.press
      target:
        entity_id: button.air_fryer_start

stop_air_fryer:
  alias: Stop air fryer
  icon: mdi:stop
  mode: single
  sequence:
    - action: button.press
      target:
        entity_id: button.air_fryer_stop
