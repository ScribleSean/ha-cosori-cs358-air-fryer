# Friendly-named scripts for Assist and voice shortcuts. Add to scripts.yaml.
preheat_air_fryer:
  alias: Preheat air fryer
  description: Preheat the air fryer to a temperature.
  icon: mdi:fire
  mode: single
  fields:
    temperature:
      name: Temperature
      description: 170 to 400 °F, in steps of 10.
      required: true
      selector:
        number: {min: 170, max: 400, step: 10, unit_of_measurement: "°F"}
  sequence:
    - action: cosori_fryer.preheat
      data:
        temperature: "{{ temperature | int }}"

air_fry:
  alias: Air fry
  description: Cook at a temperature for a time. Works on its own or after a preheat.
  icon: mdi:fan
  mode: single
  fields:
    temperature:
      name: Temperature
      required: true
      selector:
        number: {min: 170, max: 400, step: 10, unit_of_measurement: "°F"}
    minutes:
      name: Cook time
      required: true
      selector:
        number: {min: 1, max: 60, unit_of_measurement: min}
  sequence:
    - action: cosori_fryer.air_fry
      data:
        temperature: "{{ temperature | int }}"
        minutes: "{{ minutes | int }}"

stop_air_fryer:
  alias: Stop air fryer
  icon: mdi:stop
  mode: single
  sequence:
    - action: cosori_fryer.stop
