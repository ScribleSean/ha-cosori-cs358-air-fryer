# Phone notifications when preheat and cooking finish.
# Replace notify.mobile_app_your_phone with your own notify action.
- id: air_fryer_preheated
  alias: "Air fryer: preheated"
  triggers:
    - trigger: event
      event_type: cosori_fryer_preheat_done
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Air fryer preheated
        message: Add food, then press Start.

- id: air_fryer_done
  alias: "Air fryer: done"
  triggers:
    - trigger: event
      event_type: cosori_fryer_cook_done
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: Air fryer done
        message: Cooking has finished.
