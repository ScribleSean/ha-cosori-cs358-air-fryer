start_cooking:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: cosori_fryer
    temperature:
      required: true
      default: 360
      selector:
        number:
          min: 170
          max: 400
          step: 10
          unit_of_measurement: "°F"
    cooking_time:
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    preheat:
      default: false
      selector:
        boolean:
