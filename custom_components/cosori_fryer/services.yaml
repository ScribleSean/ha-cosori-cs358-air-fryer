start_cook:
  fields:
    temperature:
      required: true
      example: 350
      selector:
        number:
          mode: box
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 60
          mode: box
    preheat:
      required: true
      selector:
        boolean:
    temperature_unit:
      selector:
        select:
          options:
            - "°F"
            - "°C"
    config_entry_id:
      selector:
        config_entry:
          integration: cosori_fryer
